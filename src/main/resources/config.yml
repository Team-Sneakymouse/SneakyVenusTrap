# Requires the separately installed dev:venus_trap resource-pack assets on clients.
# Set block explicitly for the no-pack sculpture; no pack is installed/served by this plugin.
visuals:
  mode: textured
# No live server item has been selected. Supply a genuine Bukkit-serialized ItemStack
# including its item model/PDC; null means disabled. No economy commands are executed.
bribe:
  item: null
lure:
  item: null
# Performed resource-pack sound event keys may replace these vanilla fallbacks.
# Final female/monstrous/stolen-voice performances are NOT included.
sounds:
  warning: entity.warden.tendril_clicks
  bite: entity.ravager.roar
  hurt: entity.ghast.hurt
  death: entity.ender_dragon.death
  cry: entity.ghast.scream
  echo: entity.ghast.scream
